<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>ENI Memory - Connexion</title>

    <link rel="icon" type="image/svg+xml" href="../ressources/question.svg">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Raleway:wght@300;700&display=swap">

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <header class="text-center pt-4 pb-2 px-2">

        <h1 class="titre-site">
            <span class="fw-light">ENI -</span>
            <span class="fw-bold">MEMORY</span>
            <span class="fw-light">- Connexion</span>
        </h1>

        <nav class="menu" aria-label="Menu principal">

            <ul class="nav justify-content-center">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Accueil</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="inscription.html">S'inscrire</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="connexion.html">Se connecter</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="profil.html">Profil</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="jouer.html">Jouer</a>
                </li>

            </ul>

        </nav>

    </header>


    <main class="container pb-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-8">

                <section class="panneau p-3 p-md-4">

                    <h2 class="h5 fw-bold mb-4">Connectez-vous à votre compte</h2>

                    <form action="" method="post">

                        <div class="champ">

                            <label for="nomUtilisateur" class="form-label">
                                Nom utilisateur
                            </label>

                            <input
                                type="text"
                                id="nomUtilisateur"
                                name="nomUtilisateur"
                                class="form-control"
                                placeholder="Ex : Richard"
                                autocomplete="username"
                                required>

                        </div>


                        <div class="champ">

                            <label for="password" class="form-label">
                                Mot de passe
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                autocomplete="current-password"
                                required>

                        </div>


                        <div class="text-center mt-4">

                            <button type="submit" class="btn btn-memory">
                                Se connecter
                            </button>

                        </div>

                    </form>

                </section>

            </div>

        </div>

    </main>

</body>
</html>
