<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ENI Memory - S'inscrire</title>
  <link rel="icon" type="image/svg+xml" href="../ressources/question.svg">
  <!-- Bootstrap (CDN), polices Google, puis notre CSS EN DERNIER (voir index.html) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Raleway:wght@300;700&display=swap">
  <link rel="stylesheet" href="../css/style.css">
</head>

<body>
  <header class="text-center pt-4 pb-2 px-2">
    <h1 class="titre-site">
      <span class="fw-light">ENI -</span>
      <span class="fw-bold">MEMORY</span>
      <span class="fw-light">- S'inscrire</span>
    </h1>
    <nav class="menu" aria-label="Menu principal">
      <ul class="nav justify-content-center">
        <li class="nav-item"><a class="nav-link" href="index.html">Accueil</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="inscription.html">S'inscrire</a></li>
        <li class="nav-item"><a class="nav-link" href="connexion.html">Se connecter</a></li>
        <li class="nav-item"><a class="nav-link" href="profil.html">Profil</a></li>
        <li class="nav-item"><a class="nav-link" href="jouer.html">Jouer</a></li>
      </ul>
    </nav>
  </header>
  <main class="container pb-5">
    <div class="row justify-content-center">
      
      <div class="col-12 col-md-8 col-lg-6">
        <section class="panneau p-3 p-md-4">
          <h2 class="h4 fw-bold text-center mb-4">Inscrivez-vous.</h2>

       
          <form id="form-inscription" method="post">
            <div class="champ">
              <label for="nom" class="form-label">Nom d'utilisateur</label>
              <input type="text" id="nom" name="nom" class="form-control"
                     placeholder="Votre nom d'utilisateur" autocomplete="username">
            </div>
            <div class="champ">
              <label for="email" class="form-label">Entrez votre email</label>
              <input type="email" id="email" name="email" class="form-control"
                     placeholder="Votre email" autocomplete="email">
            </div>
            <div class="champ">
              <label for="mot-de-passe" class="form-label">Mot de passe</label>
              <input type="password" id="mot-de-passe" name="mot-de-passe" class="form-control"
                     placeholder="Votre mot de passe" autocomplete="new-password">
            </div>
            <div class="row g-3 mt-2">
              <div class="col-6">
                <button type="submit" class="btn btn-memory w-100 h-100">Création du compte</button>
              </div>
              <div class="col-6">
                <button type="reset" class="btn btn-memory w-100 h-100">Annuler</button>
              </div>
            </div>
          </form>

        </section>
      </div>
    </div>
  </main>
</body>
</html>
